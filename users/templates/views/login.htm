{% extends 'base/base.htm' %}
{%load static %}
{% load crispy_forms_tags %}

{% block body %}
<div class="text-center">
  <main class="form-signin">
      <form method="post">
          <img class="mb-4" src="{% static 'images/logo1.png' %}" alt="Logo" width="150" height="150">
          {% csrf_token %}  <!-- Protection CSRF obligatoire -->
          {{ login_form|crispy }}  <!-- Utilisation correcte du formulaire -->
          
          <button class="w-100 btn btn-lg btn-danger" type="submit">Sign in</button>
          <p class="mt-5 mb-3 text-muted">Copyright © 2025</p>
      </form>
  </main>
</div>
{% endblock %}




{% block footer %}

{%endblock%}
